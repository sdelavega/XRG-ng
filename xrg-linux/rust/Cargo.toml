[package]
name = "xrg-ng-linux"
version = "0.2.1"
edition = "2024"
license = "GPL-3.0-or-later"
build = "build.rs"

[features]
default = []
egui-ui = ["dep:eframe", "dep:png", "dep:raw-window-handle"]

[dependencies]
async-io = "2.6.0"
futures-lite = "2.6.1"
libc = "0.2"
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow"], optional = true }
png = { version = "0.18", optional = true }
raw-window-handle = { version = "0.6", optional = true }
rusqlite = { version = "0.41.0", features = ["bundled", "hooks"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
plist = { version = "~1.10.3", default-features = false, features = ["enable_unstable_features_that_may_break_with_minor_version_bumps"] }
blake3 = { version = "1.8.7", default-features = false, features = ["std"] }

# Linux-only: the D-Bus notification protocol and the X11/Wayland eframe
# backends do not exist (or do not link) on other platforms.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.19.0", default-features = false, features = ["async-io"] }
eframe = { version = "0.37.0", default-features = false, features = ["wayland", "x11"], optional = true }
