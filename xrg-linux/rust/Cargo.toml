[package]
name = "xrg-ng-linux"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
build = "build.rs"

[features]
default = []
gtk-ui = ["dep:gtk"]

[dependencies]
libc = "0.2"
gtk = { package = "gtk4", version = "0.11", features = ["v4_10"], optional = true }
rusqlite = { version = "0.41.0", features = ["bundled", "hooks"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
plist = { version = "~1.10.3", default-features = false, features = ["enable_unstable_features_that_may_break_with_minor_version_bumps"] }
blake3 = { version = "1.8.7", default-features = false, features = ["std"] }
