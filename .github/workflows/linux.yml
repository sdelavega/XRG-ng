name: Linux Swift and Rust
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_candidate:
        description: Build release package versions for local signing
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    name: ${{ matrix.runner }} ${{ matrix.configuration }}
    runs-on: ${{ matrix.runner }}
    container: swift:6.4.1-noble
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        configuration: [debug, release]
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install windowing dependencies and Rust
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential curl pkg-config libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libx11-dev libxi-dev libxrandr-dev libxcursor-dev libegl1-mesa-dev libgl1-mesa-dev libgl1-mesa-dri xvfb xauth xclip dbus-x11 python3 patchelf desktop-file-utils weston fluxbox picom xdotool x11-utils imagemagick rpm zstd libarchive-tools squashfs-tools gnupg
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh
          sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain 1.99.1 --component clippy --component rustfmt
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Test shared Swift core, Rust collectors and egui application
        id: verify
        run: |
          python3 -m unittest discover -s Tools/tests -p 'test_linux_*.py' -v
          python3 -m unittest discover -s Tools/tests -p 'test_check_version.py' -v
          bash Tools/ci-linux.sh "${{ matrix.configuration }}"
      - name: Package tested Linux preview
        if: matrix.configuration == 'release'
        id: package
        shell: bash
        env:
          XRG_RELEASE_CANDIDATE: ${{ inputs.release_candidate == true }}
        run: |
          # Checkout configures trust under its temporary HOME. The container's
          # later Git commands need the same exact workspace in their own HOME.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          channel=()
          if [[ "$XRG_RELEASE_CANDIDATE" == true ]]; then channel=(--release); fi
          python3 Tools/package-linux.py "${channel[@]}" \
            --binary "${{ steps.verify.outputs.binary }}" \
            --swift-library "${{ steps.verify.outputs.swift_library }}" --deb --rpm --arch --appimage
      - name: Upload Linux preview archive, native package and checksums
        if: matrix.configuration == 'release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.runner }}-preview
          compression-level: 0
          if-no-files-found: error
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}
            ${{ steps.package.outputs.deb }}
            ${{ steps.package.outputs.deb_checksum }}
            ${{ steps.package.outputs.rpm }}
            ${{ steps.package.outputs.rpm_checksum }}
            ${{ steps.package.outputs.arch }}
            ${{ steps.package.outputs.arch_checksum }}
            ${{ steps.package.outputs.appimage }}
            ${{ steps.package.outputs.appimage_checksum }}
      - name: Build frozen previous application for real-version upgrade checks
        if: matrix.configuration == 'release'
        run: bash Tools/tests/check-baseline-isolation.sh "$GITHUB_WORKSPACE/dist/upgrade-baseline"
      - name: Upload previous application fixture
        if: matrix.configuration == 'release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.runner }}-upgrade-baseline
          compression-level: 0
          if-no-files-found: error
          # Relative directory avoids host/container runner.temp translation
          # flattening one glob differently and dropping the checksum file.
          path: dist/upgrade-baseline/
      - name: Upload validation log
        if: always() && steps.verify.outputs.results != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.runner }}-${{ matrix.configuration }}-results
          path: |
            ${{ steps.verify.outputs.results }}/validation.log
            ${{ steps.verify.outputs.results }}/egui-smoke.png
            ${{ steps.verify.outputs.results }}/compact-Classic.png
            ${{ steps.verify.outputs.results }}/compact-Midnight.png
            ${{ steps.verify.outputs.results }}/preferences-smoke.png
            ${{ steps.verify.outputs.results }}/layout-smoke.png
            ${{ steps.verify.outputs.results }}/file-picker.png
            ${{ steps.verify.outputs.results }}/file-replace.png
            ${{ steps.verify.outputs.results }}/desktop-*/
  preview-install:
    name: ${{ matrix.runner }} clean runtime install
    needs: build-and-test
    runs-on: ${{ matrix.runner }}
    container: ubuntu:24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install smoke tools only
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3 xvfb xauth dbus-x11 desktop-file-utils
          useradd --uid 10001 --create-home xrg-preview
          mkdir -p /tmp/xrg-preview-results
          chown xrg-preview /tmp/xrg-preview-results
      - name: Download native preview
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: linux-${{ matrix.runner }}-preview
          path: /tmp/xrg-preview-download
      - name: Download frozen previous application
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: linux-${{ matrix.runner }}-upgrade-baseline
          path: /tmp/xrg-upgrade-baseline
      - name: Install, launch, upgrade and remove native package without toolchains
        run: >-
          python3 Tools/deb-smoke-linux.py --disposable-system
          --package /tmp/xrg-preview-download/*.deb
          --results /tmp/xrg-preview-results/native
      - name: Upgrade application 0.2.0 to 0.2.1 and verify effective preferences
        run: >-
          runuser -u xrg-preview -- python3 Tools/application-upgrade-linux.py
          --baseline /tmp/xrg-upgrade-baseline/*.tar.gz
          --current /tmp/xrg-preview-download/*.tar.gz
          --results /tmp/xrg-preview-results/application-upgrade
      - name: Install, relocate, launch, upgrade and uninstall without toolchains
        run: >-
          runuser -u xrg-preview -- python3 Tools/preview-smoke-linux.py
          --archive /tmp/xrg-preview-download/*.tar.gz
          --results /tmp/xrg-preview-results
      - name: Upload clean-runtime validation
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.runner }}-preview-install-results
          path: /tmp/xrg-preview-results/
      - name: Launch relocated AppImage without FUSE or toolchains
        run: >-
          python3 Tools/formats-smoke-linux.py --disposable-system --format appimage
          --package /tmp/xrg-preview-download/*.AppImage
          --results /tmp/xrg-preview-results/appimage
      - name: Upload AppImage validation
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.runner }}-appimage-results
          path: /tmp/xrg-preview-results/appimage/
  native-formats-install:
    name: ${{ matrix.runner }} ${{ matrix.format }} install
    needs: build-and-test
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, format: rpm, image: 'fedora:44' }
          - { runner: ubuntu-24.04-arm, format: rpm, image: 'fedora:44' }
          - { runner: ubuntu-24.04, format: arch, image: 'archlinux:base' }
          - { runner: ubuntu-24.04-arm, format: arch, image: 'xrg-arch-arm-ci:local' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: linux-${{ matrix.runner }}-preview
          path: ${{ runner.temp }}/xrg-packages
      - name: Prepare native distribution runtime
        env:
          XRG_FORMAT: ${{ matrix.format }}
          XRG_IMAGE: ${{ matrix.image }}
        run: |
          if [[ "$XRG_IMAGE" == xrg-arch-arm-ci:local ]]; then bash Tools/arch-arm-container.sh; fi
          docker run -d --name xrg-format-check -v "$PWD:/workspace:ro" -v "$RUNNER_TEMP/xrg-packages:/packages:ro" -w /workspace "$XRG_IMAGE" /bin/bash -c 'sleep infinity'
          if [[ "$XRG_FORMAT" == rpm ]]; then
            docker exec xrg-format-check bash -c 'dnf install -y python3 xorg-x11-server-Xvfb xorg-x11-xauth dbus-daemon desktop-file-utils shadow-utils && useradd --uid 10001 --create-home xrg-preview'
          else
            docker exec xrg-format-check bash -c 'pacman-key --init && pacman-key --populate && pacman --disable-sandbox -Syu --noconfirm --needed python xorg-server-xvfb xorg-xauth dbus desktop-file-utils shadow && useradd --uid 10001 --create-home xrg-preview'
          fi
      - name: Resolve dependencies, launch, upgrade and remove native package
        env:
          XRG_FORMAT: ${{ matrix.format }}
        run: |
          docker exec xrg-format-check bash -c 'python3 Tools/formats-smoke-linux.py --disposable-system --format "$1" --package /packages/*.$2 --archive /packages/*.tar.gz --results /tmp/xrg-format-results' sh "$XRG_FORMAT" "$(if [[ "$XRG_FORMAT" == rpm ]]; then echo rpm; else echo pkg.tar.zst; fi)"
      - name: Collect runtime results
        if: always()
        run: |
          docker cp xrg-format-check:/tmp/xrg-format-results "$RUNNER_TEMP/xrg-format-results" || true
          docker rm -f xrg-format-check || true
      - name: Upload native format validation
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.runner }}-${{ matrix.format }}-results
          path: ${{ runner.temp }}/xrg-format-results/
