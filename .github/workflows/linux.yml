name: Linux Swift and Rust
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    name: ${{ matrix.runner }} ${{ matrix.configuration }}
    runs-on: ${{ matrix.runner }}
    container: swift:6.4.1-noble
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        configuration: [debug, release]
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install GTK and Rust
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential curl pkg-config libgtk-4-dev xvfb xauth dbus-x11 python3 patchelf desktop-file-utils
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh
          sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain 1.99.1 --component clippy --component rustfmt
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Test shared Swift core, Rust collectors and GTK application
        id: verify
        run: bash Tools/ci-linux.sh "${{ matrix.configuration }}"
      - name: Package tested Linux preview
        if: matrix.configuration == 'release'
        id: package
        run: |
          # Checkout configures trust under its temporary HOME. The container's
          # later Git commands need the same exact workspace in their own HOME.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 Tools/package-linux.py \
            --binary "${{ steps.verify.outputs.binary }}" \
            --swift-library "${{ steps.verify.outputs.swift_library }}"
      - name: Upload Linux preview archive and checksum
        if: matrix.configuration == 'release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.runner }}-preview
          compression-level: 0
          if-no-files-found: error
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}
      - name: Upload validation log
        if: always() && steps.verify.outputs.results != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.runner }}-${{ matrix.configuration }}-results
          path: |
            ${{ steps.verify.outputs.results }}/validation.log
            ${{ steps.verify.outputs.results }}/gtk-smoke.png
            ${{ steps.verify.outputs.results }}/preferences-smoke.png
            ${{ steps.verify.outputs.results }}/sampling-preferences.png
            ${{ steps.verify.outputs.results }}/opacity-preferences.png
            ${{ steps.verify.outputs.results }}/window-size-preferences.png
            ${{ steps.verify.outputs.results }}/network-scale-preferences.png
            ${{ steps.verify.outputs.results }}/network-scale.png
            ${{ steps.verify.outputs.results }}/p3-imported.png
            ${{ steps.verify.outputs.results }}/processes-smoke.png
            ${{ steps.verify.outputs.results }}/ai-smoke.png
            ${{ steps.verify.outputs.results }}/ai-sources-smoke.png
            ${{ steps.verify.outputs.results }}/weather-smoke.png
            ${{ steps.verify.outputs.results }}/menu-smoke.png
            ${{ steps.verify.outputs.results }}/details-smoke.png
            ${{ steps.verify.outputs.results }}/import-smoke.png
            ${{ steps.verify.outputs.results }}/layout-smoke.png
            ${{ steps.verify.outputs.results }}/npu-smoke.png
  preview-install:
    name: ${{ matrix.runner }} clean runtime install
    needs: build-and-test
    runs-on: ${{ matrix.runner }}
    container: ubuntu:24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install runtime and smoke tools only
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libgtk-4-1 adwaita-icon-theme librsvg2-common libstdc++6 libgcc-s1 python3 python3-gi curl ca-certificates xvfb xauth dbus-x11 desktop-file-utils
          useradd --uid 10001 --create-home xrg-preview
          mkdir -p /tmp/xrg-preview-results
          chown xrg-preview /tmp/xrg-preview-results
      - name: Download native preview
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: linux-${{ matrix.runner }}-preview
          path: /tmp/xrg-preview-download
      - name: Install, relocate, launch, upgrade and uninstall without toolchains
        run: >-
          runuser -u xrg-preview -- python3 Tools/preview-smoke-linux.py
          --archive /tmp/xrg-preview-download/*.tar.gz
          --results /tmp/xrg-preview-results
      - name: Upload clean-runtime validation
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.runner }}-preview-install-results
          path: /tmp/xrg-preview-results/
