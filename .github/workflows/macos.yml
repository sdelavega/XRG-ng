name: macOS

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.configuration }} build and tests
    runs-on: macos-26-intel
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build universal app and run tests
        id: verify
        run: bash Tools/ci-macos.sh "${{ matrix.configuration }}"
      - name: Upload logs and test results
        if: always() && steps.verify.outputs.results != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-${{ matrix.configuration }}-results
          path: |
            ${{ steps.verify.outputs.results }}/*.log
            ${{ steps.verify.outputs.results }}/*.json
            ${{ steps.verify.outputs.results }}/*.xcresult
          retention-days: 7
          if-no-files-found: warn
